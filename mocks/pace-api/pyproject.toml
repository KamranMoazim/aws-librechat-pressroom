[project]
name = "pace-api"
version = "0.1.0"
description = "Stand-in for EFI Pace: jobs, parts, estimates, customers, notes and status"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121", "uvicorn>=0.38"]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
