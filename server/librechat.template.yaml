version: 1.3.17
cache: true

registration:
  socialLogins: ['openid']

interface:
  modelSelect: true
  parameters: false
  presets: false
  contextUsage: true
  contextCost: true
  webSearch: false
  runCode: false
  memories: false
  marketplace:
    use: false
  agents:
    use: true
    create: true
    share: true
    public: false
  prompts:
    use: true
    create: true
    share: true
    public: false
  sharedLinks:
    create: true
    share: true
    public: false
  temporaryChat: true
  mcpServers:
    use: true
    create: false
    share: false
    public: false
    configureObo: false
  retentionMode: 'all'
  generalChatRetention: 2160
  temporaryChatRetention: 24
  retainAgentFiles: true

memory:
  disabled: true

balance:
  enabled: true
  startBalance: 20000000
  autoRefillEnabled: true
  refillIntervalValue: 1
  refillIntervalUnit: 'months'
  refillAmount: 20000000

transactions:
  enabled: true

endpoints:
  custom:
    - name: 'xAI'
      apiKey: '${XAI_API_KEY}'
      baseURL: 'https://api.x.ai/v1'
      models:
        default: ['grok-4.7']
        fetch: false
      titleConvo: true
      titleModel: 'current_model'
      tokenConfig:
        grok-4.7:
          prompt: 2
          completion: 6
          cacheRead: 0.5
          context: 256000
  agents:
    allowedProviders: ['anthropic', 'openAI', 'xAI']
    capabilities:
      - 'deferred_tools'
      - 'file_search'
      - 'artifacts'
      - 'subagents'
      - 'context'
      - 'skills'
      - 'ask_user_question'
      - 'tools'
    toolApproval:
      enabled: true
      mode: 'default'
      allow:
        - 'mcp:outlook:mail_search'
        - 'mcp:outlook:mail_get'
        - 'mcp:outlook:calendar_view'
        - 'mcp:pace:job_search'
        - 'mcp:pace:job_get'
        - 'mcp:pace:estimate_get'
        - 'mcp:pace:job_update_prepare'
        - 'mcp:relevance:agents_list'
        - 'mcp:relevance:agent_result'
        - 'mcp:voice:voice_agents_list'
        - 'mcp:voice:conversations_list'
        - 'mcp:voice:conversation_get'
      ask:
        - 'mcp:outlook:draft_reply'
        - 'mcp:pace:job_update_commit'
        - 'mcp:relevance:agent_run'
        - 'mcp:voice:start_call'
      reason: 'Check {tool} before it runs.'
    checkpointer:
      type: 'mongo'
      ttl: 86400

mcpSettings:
  allowedAddresses:
    - 'mcp-outlook:8101'
    - 'mcp-pace:8102'
    - 'mcp-relevance:8103'
    - 'mcp-voice:8104'

mcpServers:
  outlook:
    title: 'Outlook'
    description: 'Search and read your mail, view your calendar, and save reply drafts (never sends)'
    type: streamable-http
    url: 'http://mcp-outlook:8101/mcp'
    startup: false
    timeout: 60000
    obo:
      scopes: 'api://@@MCP_CLIENT_ID@@/Mcp.Tools'
    requestHeaders:
      X-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
  pace:
    title: 'Pace'
    description: 'Look up jobs and estimates; status, due date and note changes need your approval'
    type: streamable-http
    url: 'http://mcp-pace:8102/mcp'
    startup: false
    timeout: 60000
    obo:
      scopes: 'api://@@MCP_CLIENT_ID@@/Mcp.Tools'
    requestHeaders:
      X-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
  relevance:
    title: 'Relevance AI'
    description: 'Run approved Relevance AI agents and read their results'
    type: streamable-http
    url: 'http://mcp-relevance:8103/mcp'
    startup: false
    timeout: 60000
    obo:
      scopes: 'api://@@MCP_CLIENT_ID@@/Mcp.Tools'
    requestHeaders:
      X-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'
  voice:
    title: 'Voice agents'
    description: 'Read ElevenLabs voice agent calls, transcripts and summaries'
    type: streamable-http
    url: 'http://mcp-voice:8104/mcp'
    startup: false
    timeout: 60000
    obo:
      scopes: 'api://@@MCP_CLIENT_ID@@/Mcp.Tools'
    requestHeaders:
      X-Conversation-Id: '{{LIBRECHAT_BODY_CONVERSATIONID}}'

speech:
  tts:
    maxInputChars: 4000
    elevenlabs:
      apiKey: '${ELEVENLABS_API_KEY}'
      model: 'eleven_multilingual_v2'
      voices: ['@@ELEVENLABS_VOICE_ID@@']
  stt:
    openai:
      apiKey: '${OPENAI_API_KEY}'
      model: 'whisper-1'
  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: 'external'
      autoSendText: -1
    textToSpeech:
      engineTTS: 'external'
      automaticPlayback: false

modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints: ['agents']
  list:
    - name: 'claude-everyday'
      label: 'Claude: everyday writing'
      description: 'Emails, quotes, proofs and everyday questions'
      default: true
      preset: { endpoint: anthropic, model: claude-sonnet-5-5 }
    - name: 'claude-deep'
      label: 'Claude: deep work'
      description: 'Long documents, estimates and careful reasoning'
      preset: { endpoint: anthropic, model: claude-opus-5-5 }
    - name: 'gpt-analysis'
      label: 'GPT: data and spreadsheets'
      description: 'Spreadsheets, tables and numbers'
      preset: { endpoint: openAI, model: gpt-6-sol }
    - name: 'grok-research'
      label: 'Grok: current events research'
      description: 'Market and current events research'
      preset: { endpoint: xAI, model: grok-4.7 }
